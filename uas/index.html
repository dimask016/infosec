<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔒 API Security Assessment – All Questions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #f4f7fc;
      color: #1e293b;
      padding: 1.5rem 1rem;
      min-height: 100vh;
    }

    .container {
      max-width: 1350px;
      margin: 0 auto;
    }

    /* Header */
    .app-header {
      background: #ffffff;
      border-radius: 24px;
      padding: 1.5rem 2rem;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
      margin-bottom: 1.8rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      border-left: 8px solid #2c7be5;
    }

    .app-header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #0b2b4a;
    }

    .app-header h1 i {
      color: #2c7be5;
      margin-right: 0.5rem;
    }

    .app-header .sub {
      font-size: 0.95rem;
      color: #475569;
    }

    /* Tabs */
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      background: #ffffff;
      border-radius: 20px;
      padding: 0.6rem 1rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
      margin-bottom: 1.5rem;
      border: 1px solid #f1f5f9;
    }

    .tab-btn {
      background: transparent;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.9rem;
      color: #64748b;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      white-space: nowrap;
    }

    .tab-btn i {
      font-size: 1rem;
      color: #94a3b8;
    }

    .tab-btn:hover {
      background: #f1f5f9;
      color: #0b2b4a;
    }

    .tab-btn.active {
      background: #0b2b4a;
      color: white;
      box-shadow: 0 4px 12px rgba(11, 43, 74, 0.2);
    }

    .tab-btn.active i {
      color: white;
    }

    /* Tab Content */
    .tab-content-wrapper {
      background: transparent;
      border-radius: 24px;
      overflow: hidden;
      position: relative;
    }

    .tab-pane {
      display: none;
      animation: fadeIn 0.3s ease;
      background: transparent;
      width: 100%;
    }

    .tab-pane.active {
      display: block;
    }

    .tab-pane iframe {
      width: 100%;
      min-height: 90vh;
      height: auto;
      border: none;
      border-radius: 24px;
      background: #ffffff;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .app-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.5rem;
        padding: 1rem 1.2rem;
      }
      .app-header h1 {
        font-size: 1.4rem;
      }
      .tabs {
        padding: 0.5rem 0.8rem;
        gap: 0.3rem;
        overflow-x: auto;
        flex-wrap: nowrap;
        -webkit-overflow-scrolling: touch;
      }
      .tab-btn {
        font-size: 0.8rem;
        padding: 0.4rem 0.9rem;
      }
      .tab-btn i {
        font-size: 0.8rem;
      }
      .tab-pane iframe {
        min-height: 80vh;
        border-radius: 16px;
      }
    }

    @media (max-width: 480px) {
      .tab-btn {
        font-size: 0.7rem;
        padding: 0.3rem 0.7rem;
      }
      .tab-btn i {
        display: none;
      }
      .app-header h1 {
        font-size: 1.2rem;
      }
    }

    /* Footer */
    .footer-note {
      margin-top: 2rem;
      text-align: center;
      color: #94a3b8;
      font-size: 0.85rem;
      border-top: 1px solid #e2e8f0;
      padding-top: 1.5rem;
    }
  </style>
</head>
<body>
<div class="container">

  <!-- Header -->
  <div class="app-header">
    <div>
      <h1><i class="fas fa-shield-alt"></i> API Security Assessment</h1>
      <span class="sub">PT GlobalRetail – Customer Rewards API (Part F – 20 Points)</span>
    </div>
    <div style="display: flex; gap: 0.5rem; align-items: center;">
      <span style="background: #f1f5f9; padding: 0.2rem 1rem; border-radius: 30px; font-size: 0.8rem; font-weight: 600; color: #475569;">
        <i class="far fa-file-alt"></i> 6 Halaman
      </span>
    </div>
  </div>

  <!-- Tabs -->
  <nav class="tabs" id="tabNav">
    <button class="tab-btn active" data-tab="tab0"><i class="fas fa-book-open"></i> Case Study</button>
    <button class="tab-btn" data-tab="tab1"><i class="fas fa-question-circle"></i> Q10 – MC</button>
    <button class="tab-btn" data-tab="tab2"><i class="fas fa-pen-fancy"></i> Q11 – Short</button>
    <button class="tab-btn" data-tab="tab3"><i class="fas fa-clipboard-list"></i> Q12 – Risk</button>
    <button class="tab-btn" data-tab="tab4"><i class="fas fa-check-double"></i> Q13 – Security</button>
    <button class="tab-btn" data-tab="tab5"><i class="fas fa-exclamation-triangle"></i> Q14 – Analysis</button>
  </nav>

  <!-- Content -->
  <div class="tab-content-wrapper">
    <!-- Tab 0: Case Study -->
    <div class="tab-pane active" id="tab0">
      <iframe src="PTGlobalRetail.html" loading="lazy" title="Case Study"></iframe>
    </div>
    <!-- Tab 1: Q10 -->
    <div class="tab-pane" id="tab1">
      <iframe src="Question10.html" loading="lazy" title="Question 10"></iframe>
    </div>
    <!-- Tab 2: Q11 -->
    <div class="tab-pane" id="tab2">
      <iframe src="APISecurityWeaknesses.html" loading="lazy" title="Question 11"></iframe>
    </div>
    <!-- Tab 3: Q12 -->
    <div class="tab-pane" id="tab3">
      <iframe src="Question12.html" loading="lazy" title="Question 12"></iframe>
    </div>
    <!-- Tab 4: Q13 -->
    <div class="tab-pane" id="tab4">
      <iframe src="Question13.html" loading="lazy" title="Question 13"></iframe>
    </div>
    <!-- Tab 5: Q14 -->
    <div class="tab-pane" id="tab5">
      <iframe src="Question14.html" loading="lazy" title="Question 14"></iframe>
    </div>
  </div>

  <div class="footer-note">
    <i class="fas fa-lock" style="margin-right: 0.4rem;"></i> Semua halaman terintegrasi dalam satu tampilan. Klik tab untuk beralih.
  </div>
</div>

<script>
  (function() {
    const tabButtons = document.querySelectorAll('.tab-btn');
    const panes = {
      tab0: document.getElementById('tab0'),
      tab1: document.getElementById('tab1'),
      tab2: document.getElementById('tab2'),
      tab3: document.getElementById('tab3'),
      tab4: document.getElementById('tab4'),
      tab5: document.getElementById('tab5')
    };

    // Fungsi untuk mengaktifkan tab
    function activateTab(tabId) {
      // Sembunyikan semua pane
      Object.values(panes).forEach(pane => pane.classList.remove('active'));
      // Tampilkan pane yang dipilih
      if (panes[tabId]) panes[tabId].classList.add('active');
      // Update tombol
      tabButtons.forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.querySelector(`.tab-btn[data-tab="${tabId}"]`);
      if (activeBtn) activeBtn.classList.add('active');
    }

    // Tambahkan event listener ke setiap tombol tab
    tabButtons.forEach(btn => {
      btn.addEventListener('click', function(e) {
        const tabId = this.getAttribute('data-tab');
        activateTab(tabId);
        // Scroll ke atas konten (opsional)
        // window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });

    // Set tinggi iframe agar sesuai konten (tidak diperlukan jika min-height sudah diatur)

    console.log('✅ Index dengan tab siap digunakan.');
  })();
</script>

</body>
</html>
